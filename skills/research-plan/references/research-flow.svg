<svg xmlns="http://www.w3.org/2000/svg" width="680" height="886" viewBox="0 0 680 886" role="img" aria-labelledby="title desc">
<title id="title">研究过程与实验过程</title>
<desc id="desc">灵感可以在任一步骤接入。研究缺口从左侧返回初步问题，调整问法。结论向下整理为成果。右侧四条回线分别是补查文献（返回文献调研）、修订问题（返回研究问题）、修正假设（返回假设）、补充实验（返回实验设计）。</desc>
<defs>
<marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#566c98"/></marker>
</defs>
<style>
text { font: 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill:#1e293b; text-anchor:middle; dominant-baseline:middle }
.heading { font-weight:700; text-anchor:start }
.note { font-size:14px; fill:#405782 }
.step { fill:white; stroke:#94a3b8 }
.main { fill:none; stroke:#475569; stroke-width:1.5; marker-end:url(#forward) }
.feedback { fill:none; stroke:#566c98; stroke-width:1.5; stroke-dasharray:5 4; stroke-linejoin:round }
</style>
