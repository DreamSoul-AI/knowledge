<path class="feedback" d="M375 747 H565 V216"/>
<g id="return-to-literature">
  <path class="feedback" marker-end="url(#return)" d="M565 216 H375"/>
  <text class="note" x="452" y="201">补查文献</text>
</g>
<g id="return-to-question">
  <path class="feedback" marker-end="url(#return)" d="M565 356 H375"/>
  <text class="note" x="452" y="341">修订问题</text>
</g>
<g id="return-to-hypothesis">
  <path class="feedback" marker-end="url(#return)" d="M565 473 H375"/>
  <text class="note" x="452" y="458">修正假设</text>
</g>
<g id="return-to-experiment-design">
  <path class="feedback" marker-end="url(#return)" d="M565 543 H375"/>
  <text class="note" x="452" y="528">补充实验</text>
</g>

