<svg xmlns="http://www.w3.org/2000/svg" width="680" height="886" viewBox="0 0 680 886" role="img" aria-labelledby="title desc">
<title id="title">Research and experiment flow</title>
<desc id="desc">Inspiration can enter at any step. A research gap can prompt a rephrased initial question. The conclusion leads to research outputs. Four arrows lead back to the literature review, research question, hypothesis, or experiment design.</desc>
<defs>
<marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
<marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#566c98"/></marker>
</defs>
<style>
text { font: 14px Arial, sans-serif; fill:#1e293b; text-anchor:middle; dominant-baseline:middle }
.heading { font-size:16px; font-weight:700; text-anchor:start }
.note { font-size:13px; fill:#405782 }
.step { fill:white; stroke:#94a3b8 }
.main { fill:none; stroke:#475569; stroke-width:1.5; marker-end:url(#forward) }
.feedback { fill:none; stroke:#566c98; stroke-width:1.5; stroke-dasharray:5 4; stroke-linejoin:round }
</style>
<rect width="680" height="886" fill="white"/>
<rect x="113" y="78" width="398" height="727" rx="14" fill="#f8fafc" stroke="#aab8ca"/>
<rect x="133" y="408" width="358" height="380" rx="12" fill="#edf4ff" stroke="#86a5ce"/>
<text class="heading" x="131" y="102">Research process</text>
<text class="heading" x="151" y="433">Experiment process</text>
<rect x="249" y="17" width="126" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
<text x="312" y="37" style="font-weight:700">Inspiration</text>
<path class="main" d="M312 57 V76"/>

<path class="main" d="M312 167 V195"/>
<path class="main" d="M312 237 V265"/>
<path class="main" d="M312 307 V335"/>
<path class="main" d="M312 377 V452"/>
<path class="main" d="M312 494 V522"/>
<path class="main" d="M312 704 V726"/>
<path class="main" d="M312 768 V822"/>
<path class="main" d="M312 564 V578 H221 V592"/>
<path class="main" d="M221 634 V647 H312 V662"/>
<path class="main" d="M312 564 V578 H403 V592"/>
<path class="main" d="M403 634 V647 H312 V662"/>
<path class="feedback" marker-end="url(#return)" d="M249 286 H65 V146 H249"/>
<text class="note" x="59" y="124">Reframe question</text>
<path class="feedback" d="M375 747 H565 V216"/>
<g id="return-to-literature">
  <path class="feedback" marker-end="url(#return)" d="M565 216 H375"/>
  <text class="note" x="433" y="201">Revisit literature</text>
</g>
<g id="return-to-question">
  <path class="feedback" marker-end="url(#return)" d="M565 356 H375"/>
  <text class="note" x="433" y="341">Revise question</text>
</g>
<g id="return-to-hypothesis">
  <path class="feedback" marker-end="url(#return)" d="M565 473 H375"/>
  <text class="note" x="433" y="458">Revise hypothesis</text>
</g>
<g id="return-to-experiment-design">
  <path class="feedback" marker-end="url(#return)" d="M565 543 H375"/>
  <text class="note" x="433" y="528">Add experiments</text>
</g>

<rect class="step" x="249" y="125" width="126" height="42" rx="7"/><text x="312" y="146">Initial question</text>
<rect class="step" x="249" y="195" width="126" height="42" rx="7"/><text x="312" y="216">Literature review</text>
<rect class="step" x="249" y="265" width="126" height="42" rx="7"/><text x="312" y="286">Research gap</text>
<rect class="step" x="249" y="335" width="126" height="42" rx="7"/><text x="312" y="356">Research question</text>
<rect class="step" x="249" y="452" width="126" height="42" rx="7"/><text x="312" y="473">Hypothesis</text>
<rect class="step" x="249" y="522" width="126" height="42" rx="7"/><text x="312" y="543">Experiment design</text>
<rect class="step" x="249" y="662" width="126" height="42" rx="7"/><text x="312" y="683">Analysis</text>
<rect class="step" x="249" y="726" width="126" height="42" rx="7"/><text x="312" y="747">Conclusion</text>
<rect class="step" x="249" y="822" width="126" height="42" rx="7"/><text x="312" y="843">Outputs</text>
<rect class="step" x="147" y="592" width="148" height="42" rx="7"/><text x="221" y="613">Thought experiment</text>
<rect class="step" x="329" y="592" width="148" height="42" rx="7"/><text x="403" y="613">Empirical experiment</text>
</svg>
