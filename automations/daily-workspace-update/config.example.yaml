# Preparation only. This file does not register or enable a scheduled task.
name: daily-workspace-update
deployment:
  enabled: false
  timezone: null
  schedule: null
  project: null
  thread: null
scope:
  workspace: null
  adopted_record: null
  capabilities: [] # Source/ref, actual install path and retained customizations come from adoption records.
  include_workspace_templates: true
  exclusions: []
execution:
  mode: check # update requires confirmed scope and authorization.
  source_policy: adopted_sources
  fixed_revision_per_run: true
  install_all: false
github_distribution:
  enabled: false # Separate from scheduler enablement and check/update mode.
  organizations: [] # Use existing adoption records when the selected scope is already known.
  repositories: [] # Repository and target branches; an existing list alone does not enable distribution.
refresh:
  when: verified_changes
  skill: refresh-chat
  skill_entry: null # Optional external integration: an adopted entry or an explicitly configured local trial entry.
  targets: [] # Current execution chat plus related chats identified in this update's confirmed scope.
  preserve_task_state: true
output:
  directory: null
  destination: current_task_chat
state:
  receipt: null
  reuse_completed_items: true

private_git:
  enabled: false
  repo: null
  branch: null
  allowlist: []
  dependencies: []
